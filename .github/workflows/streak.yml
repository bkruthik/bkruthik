name: Generate Streak Stats SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate streak stats image
        uses: DenverCoder1/github-readme-streak-stats@v3
        with:
          user_id: bkruthik
          theme: tokyonight
          hide_border: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push the SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update streak stats SVG"
          git push
